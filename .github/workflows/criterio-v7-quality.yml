name: CRITERIO V7 quality

on:
  push:
    paths:
      - 'criterio-v7/**'
      - '.github/workflows/criterio-v7-quality.yml'
  pull_request:
    paths:
      - 'criterio-v7/**'
      - '.github/workflows/criterio-v7-quality.yml'

permissions:
  contents: read

jobs:
  site-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static HTML and asset checks
        run: python criterio-v7/qa/static_checks.py
      - name: JavaScript syntax
        run: node --check criterio-v7/app.js
      - name: Install Chromium test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real browser smoke tests
        run: python criterio-v7/qa/browser_smoke.py
