name: CRITERIO V7.6 living FX quality
on:
  push:
    paths:
      - 'criterio-v7-6/**'
      - '.github/workflows/criterio-v7-6-quality.yml'
  pull_request:
    paths:
      - 'criterio-v7-6/**'
      - '.github/workflows/criterio-v7-6-quality.yml'
permissions:
  contents: read
jobs:
  living-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JS source
        run: node --check criterio-v7-6/app.js
      - name: Static contract + assets + resource budget
        run: |
          python criterio-v7-6/qa/static_checks.py
          python criterio-v7-6/qa/resource_budget.py
      - name: Chromium test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Responsive interaction smoke
        run: python criterio-v7-6/qa/browser_smoke.py
      - name: Dossier movement and interactions
        run: python criterio-v7-6/qa/dossier_motion.py
      - name: Cinematic transition checks
        run: python criterio-v7-6/qa/cinematic_bridges.py
      - name: Production regression checks
        run: python criterio-v7-6/qa/production_gate.py
      - name: Living FX perceptibility, motion state, accessibility
        run: python criterio-v7-6/qa/living_fx.py
