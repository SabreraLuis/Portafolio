name: CRITERIO V7.8 marketing + communication quality
on:
  push:
    paths:
      - 'criterio-v7-8/**'
      - '.github/workflows/criterio-v7-8-quality.yml'
  pull_request:
    paths:
      - 'criterio-v7-8/**'
      - '.github/workflows/criterio-v7-8-quality.yml'
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: node --check criterio-v7-8/app.js
      - name: Content integrity, local assets and size budget
        run: |
          python criterio-v7-8/qa/static_checks.py
          python criterio-v7-8/qa/resource_budget.py
      - name: Install browser test runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Professional positioning and mobile composition
        run: python criterio-v7-8/qa/marketing_positioning.py
      - name: Browser smoke and navigation
        run: |
          python criterio-v7-8/qa/browser_smoke.py
          python criterio-v7-8/qa/navigation_quality.py
      - name: Dossiers and cinematic transitions
        run: |
          python criterio-v7-8/qa/dossier_motion.py
          python criterio-v7-8/qa/cinematic_bridges.py
      - name: Production and motion quality
        run: |
          python criterio-v7-8/qa/production_gate.py
          python criterio-v7-8/qa/living_fx.py
