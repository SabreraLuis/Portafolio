name: CRITERIO V7.3 quality

on:
  push:
    paths:
      - 'criterio-v7-3/**'
      - '.github/workflows/criterio-v7-3-quality.yml'
  pull_request:
    paths:
      - 'criterio-v7-3/**'
      - '.github/workflows/criterio-v7-3-quality.yml'

permissions:
  contents: read

jobs:
  visual-system-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static checks
        run: python criterio-v7-3/qa/static_checks.py
      - name: JavaScript syntax
        run: node --check criterio-v7-3/app.js
      - name: Browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Responsive and interaction regression
        run: python criterio-v7-3/qa/browser_smoke.py
      - name: Four case art directions and motion QA
        run: python criterio-v7-3/qa/dossier_motion.py
